name: Ingest (every 6 hours)

# Calls the deployed /api/ingest endpoint one step at a time so each call stays inside the
# Vercel function time limit. Needs repository secrets CRON_SECRET and SITE_URL
# (e.g. https://findress.vercel.app). A failing step is reported but does not stop the rest.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      steps:
        description: "Comma-separated steps (blank = full sequence)"
        required: false
        default: ""

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check secrets
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$SITE_URL" ]; then
            echo "::error::Set the CRON_SECRET and SITE_URL repository secrets."
            exit 1
          fi

      - name: Run ingestion steps
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
          STEPS: ${{ github.event.inputs.steps }}
        run: |
          set -u
          if [ -n "${STEPS:-}" ]; then
            SEQUENCE="$STEPS"
          else
            SEQUENCE="ccfddl huggingface openreview wikicfp cfp,topics geocode"
          fi
          failed=0
          for step in $SEQUENCE; do
            echo "::group::$step"
            code=$(curl -sS -o response.json -w "%{http_code}" --max-time 320 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "${SITE_URL%/}/api/ingest?source=$step") || code="000"
            cat response.json 2>/dev/null | head -c 4000; echo
            echo "HTTP $code"
            if [ "$code" != "200" ]; then
              echo "::warning::step $step returned HTTP $code"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
