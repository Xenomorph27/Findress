name: CI

# Typecheck, lint, unit tests, a production build and a dependency audit on every push to main
# and on every pull request, plus a weekly run so a new advisory against an unchanged lockfile
# still shows up (Next.js refuses to build a version with a known critical vulnerability, so an
# advisory alone can break the next deploy).
# No secrets or database needed: the tests use fixtures and an in-memory Postgres (PGlite), and
# the build renders empty states without DATABASE_URL.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # package.json pins "packageManager": "pnpm@12.10.1"; corepack installs exactly that.
      - name: Enable pnpm
        run: corepack enable

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Production dependencies only, high and critical. Dev tools (shadcn CLI, drizzle-kit, ESLint
      # plugins) never ship; `pnpm audit` without --prod lists them too.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # The Playwright smoke suite against a production build, backed by a throwaway Postgres in
  # the job with a small offline fixture (scripts/seed-e2e.ts). The password and secret below
  # exist only inside this job's container; they are not the real ones and protect nothing.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: findress
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:ci-only@localhost:5432/findress
      APP_PASSWORD: ci-throwaway-password-for-e2e-only
      AUTH_SECRET: ci-throwaway-auth-secret-for-e2e-only-0123456789abcdef
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Migrate and seed the job's database
        run: |
          pnpm db:migrate
          pnpm db:seed-e2e

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Smoke tests
        run: pnpm test:e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
