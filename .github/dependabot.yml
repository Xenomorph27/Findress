# Weekly dependency update PRs. CI (typecheck, lint, tests, build, audit) runs on each one, and
# Vercel builds a preview against the isolated preview database. Merge only when CI is green.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Same idea as pnpm's minimum release age: skip versions published in the last few days.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    # Major versions (TypeScript 6, @types/node for a Node we don't run …) are upgraded on
    # purpose, not by a weekly bot PR. Security updates are not affected by this rule.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
