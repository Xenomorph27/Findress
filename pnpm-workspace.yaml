# Dependency build scripts. Unapproved scripts are skipped with a warning, never a failed install
# (also set in .npmrc, which every pnpm version reads).
strictDepBuilds: false

# Only packages that truly need their install script (pnpm 10 key):
onlyBuiltDependencies:
  - esbuild

# Same decision for pnpm 11+ (allowBuilds replaces the keys above):
allowBuilds:
  esbuild: true
  unrs-resolver: false
  sharp: false
